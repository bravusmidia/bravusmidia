<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b3a"/><stop offset=".55" stop-color="#060b18"/><stop offset="1" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/><stop offset=".5" stop-color="#1f6bff"/><stop offset="1" stop-color="#0a2a7a"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#d5dbe4"/>
      <stop offset=".52" stop-color="#8b95a5"/><stop offset=".7" stop-color="#c3cad5"/><stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6ff"/><stop offset=".45" stop-color="#3b8bff"/>
      <stop offset=".55" stop-color="#1450d8"/><stop offset="1" stop-color="#5aa6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".45"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".85"/>
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="230" text-anchor="middle" letter-spacing="-14">
    <!-- extrusão 3D -->
    <text x="262" y="344" fill="#03060f">BW</text>
    <text x="260" y="341" fill="#0b1e4a">BW</text>
    <text x="258" y="338" fill="#123374">BW</text>
    <!-- faces -->
    <text x="252" y="332"><tspan fill="url(#plat)">B</tspan><tspan fill="url(#blue)">W</tspan></text>
  </g>
  <rect x="120" y="380" width="272" height="5" rx="2.5" fill="url(#ring)" opacity=".9"/>
</svg>
