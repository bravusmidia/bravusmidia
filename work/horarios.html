<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horários livres · Bravus Mídia</title>
<meta name="description" content="Veja os horários livres para uma reunião com a Bravus Mídia e escolha o seu pelo WhatsApp.">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:M;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:M;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:M;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2');font-weight:800}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:M,system-ui,sans-serif;color:#e8edf7;background:radial-gradient(900px 500px at 50% -10%,#12306b 0,transparent 60%),#070b16;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.logo{display:block;margin:0 auto 22px;width:200px;max-width:60%;border-radius:12px}
h1{font-size:24px;margin:0 0 6px;text-align:center;letter-spacing:.2px}
.sub{color:#9aa6bf;text-align:center;margin:0 0 22px;font-size:14.5px;line-height:1.5}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:84px;padding:10px 8px;border-radius:14px;border:1px solid #22304d;background:#0e1628;color:#e8edf7;text-align:center;font:inherit;cursor:pointer}
.day b{display:block;font-size:15px}.day small{display:block;color:#8592ad;font-size:12px;margin:2px 0 6px}
.day i{font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(43,212,138,.14);color:#2bd48a}
.day.none i{background:rgba(255,255,255,.06);color:#6f7b94}
.day.on{border:2px solid #2f7bff;background:#10203f}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.slot{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;border:1px solid rgba(43,212,138,.45);background:rgba(43,212,138,.07);color:#e8edf7;text-decoration:none}
.slot b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.slot span{color:#2bd48a;font-weight:700;font-size:14px}.slot small{color:#8592ad;font-size:12px}
.slot.busy{border-color:rgba(255,90,106,.45);background:rgba(255,90,106,.08)}.slot.busy span{color:#ff5a6a}
.legend{display:flex;gap:16px;justify-content:center;margin:14px 0 0;font-size:12.5px;color:#9aa6bf}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{grid-column:1/-1;text-align:center;color:#8592ad;padding:26px 10px;border:1px dashed #22304d;border-radius:14px}
.cta{display:block;margin:22px auto 0;text-align:center;padding:14px 18px;border-radius:14px;background:#25d366;color:#062b14;font-weight:800;text-decoration:none}
.foot{text-align:center;color:#5d6984;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<main>
  <img class="logo" src="img/bravus-logo.jpg" alt="Bravus Mídia">
  <h1>Horários livres para reunião</h1>
  <p class="sub">Escolha um horário e fale com a gente no WhatsApp para confirmar.<br>Reunião online de até 1 hora, sem compromisso.</p>
  <div class="days" id="days"></div>
  <div class="legend"><span><i style="background:#2bd48a"></i>Livre</span><span><i style="background:#ff5a6a"></i>Reservado</span></div>
  <div class="slots" id="slots"><div class="empty">Carregando horários…</div></div>
  <a class="cta" id="cta" target="_blank" rel="noopener">Falar no WhatsApp</a>
  <p class="foot">Bravus Mídia · Tráfego pago com foco em vendas</p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var WA = '5585991225865';
  var WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var hm2m = function (t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); };
  var m2hm = function (m) { return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDays = function (s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  var fdate = function (s) { return s.slice(8, 10) + '/' + s.slice(5, 7); };
  var dname = function (s, i) { return i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : WD[new Date(s + 'T12:00:00').getDay()]; };
  var waLink = function (msg) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg); };
  var $ = function (id) { return document.getElementById(id); };
  $('cta').href = waLink('Olá! Vi os horários livres e quero marcar uma reunião com a Bravus Mídia.');

  var D, sel;
  function nowLocal() { var n = new Date(); return { ds: iso(n), m: n.getHours() * 60 + n.getMinutes() }; }
  function grid(ds) {
    var dur = Math.max(15, +D.slot || 60), st = hm2m(D.start), en = Math.max(hm2m(D.end), st + dur);
    var base = []; for (var m = st; m + dur <= en; m += dur) base.push(m2hm(m));
    var extra = (D.extra[ds] || []).filter(function (t) { return /^\d{2}:\d{2}$/.test(t) && base.indexOf(t) < 0; });
    var closed = D.closed[ds] || [];
    var busy = D.busy.filter(function (b) { return b.d === ds; }).map(function (b) { return hm2m(b.t); });
    var now = nowLocal(), out = [];
    var past = function (a) { return ds < now.ds || (ds === now.ds && a <= now.m); };
    base.forEach(function (t) { var a = hm2m(t); if (past(a)) return; var b = busy.some(function (x) { return x < a + dur && x + dur > a; }); if (!b && closed.indexOf(t) >= 0) return; out.push({ t: t, busy: b }); });
    extra.forEach(function (t) { var a = hm2m(t); if (past(a)) return; out.push({ t: t, busy: busy.indexOf(a) >= 0 }); });
    busy.forEach(function (a) { var t = m2hm(a); if (past(a) || out.some(function (x) { return x.busy && Math.abs(hm2m(x.t) - a) < dur; })) return; out.push({ t: t, busy: true }); });
    return out.sort(function (a, b) { return hm2m(a.t) - hm2m(b.t); });
  }
  function free(ds) { return grid(ds).filter(function (x) { return !x.busy; }).map(function (x) { return x.t; }); }
  function render() {
    var days = []; for (var i = 0; i < 7; i++) days.push(addDays(D.today, i));
    if (!sel) sel = days.filter(function (d) { return free(d).length; })[0] || days[0];
    $('days').innerHTML = days.map(function (ds, i) {
      var n = free(ds).length;
      return '<button class="day ' + (n ? '' : 'none ') + (ds === sel ? 'on' : '') + '" data-d="' + ds + '"><b>' + dname(ds, i) + '</b><small>' + fdate(ds) + '</small><i>' + (n ? n + ' livre' + (n > 1 ? 's' : '') : 'sem vagas') + '</i></button>';
    }).join('');
    var idx = days.indexOf(sel), g = grid(sel);
    $('slots').innerHTML = g.length ? g.map(function (x) {
      if (x.busy) return '<div class="slot busy"><b>' + x.t + '</b><span>Reservado</span><small>já tem reunião</small></div>';
      var msg = 'Olá! Quero marcar uma reunião com a Bravus Mídia ' + (idx === 0 ? 'hoje' : idx === 1 ? 'amanhã' : 'na ' + dname(sel, idx)) + ' (' + fdate(sel) + ') às ' + x.t + '.';
      return '<a class="slot" target="_blank" rel="noopener" href="' + waLink(msg) + '"><b>' + x.t + '</b><span>Livre</span><small>toque para escolher</small></a>';
    }).join('') : '<div class="empty">Sem horários neste dia. Veja outro dia ou chame no WhatsApp.</div>';
  }
  $('days').addEventListener('click', function (e) { var b = e.target.closest('[data-d]'); if (b) { sel = b.dataset.d; render(); } });

  var C = window.BW_CONFIG || {};
  fetch(C.SUPABASE_URL + '/rest/v1/rpc/bw_public_slots', {
    method: 'POST',
    headers: { apikey: C.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_days: 7 })
  }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    if (!j || j.off) { $('days').innerHTML = ''; $('slots').innerHTML = '<div class="empty">Agenda indisponível no momento. Chame no WhatsApp para marcar.</div>'; return; }
    D = { start: j.start, end: j.end, slot: j.slot, closed: j.closed || {}, extra: j.extra || {}, busy: j.busy || [], today: j.today || iso(new Date()) };
    render();
  }).catch(function () { $('slots').innerHTML = '<div class="empty">Não foi possível carregar os horários agora. Chame no WhatsApp para marcar.</div>'; });
  setInterval(function () { if (D) render(); }, 60000);
})();
</script>
</body>
</html>
