<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bravus Work mudou de endereço</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8edf7;background:radial-gradient(ellipse at 50% 30%,#13306b 0,#05070d 70%)}
.b{max-width:380px;padding:28px;text-align:center}img{width:72px;height:72px}h1{font-size:22px;margin:18px 0 8px}p{color:#9aa6bf;line-height:1.55;margin:0 0 20px}
a.btn{display:block;padding:15px;border-radius:14px;background:#2f7bff;color:#fff;font-weight:700;text-decoration:none;font-size:16px}small{display:block;margin-top:18px;color:#6f7b94;line-height:1.5}</style>
</head><body><div class="b">
<img src="icons/icon.svg" alt="">
<h1>O Bravus Work mudou de endereço</h1>
<p>Agora o app fica em <b>app.bravusmidia.com.br</b> — mais seguro e com endereço próprio. Seus dados continuam os mesmos.</p>
<a class="btn" href="https://app.bravusmidia.com.br/">Abrir o Bravus Work</a>
<small>No celular: abra o endereço novo, entre com seu e-mail e senha e adicione à tela de início. Depois pode apagar o ícone antigo.</small>
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if('caches' in window)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));setTimeout(()=>location.replace('https://app.bravusmidia.com.br/'),4000);</script>
</body></html>
